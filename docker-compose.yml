version: '3.8'

services:
  guardian-orchestrator:
    build: .
    container_name: guardian-orchestrator
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
      # External agent endpoints (AWS URLs for production)
      - HOTEL_AGENT_URL=https://hotel-agent.aws.region.elb.amazonaws.com
      - HOSPITAL_AGENT_URL=https://hospital-agent.aws.region.elb.amazonaws.com
      - VOICE_AGENT_URL=https://voice-agent.aws.region.elb.amazonaws.com
      - NOTIFICATION_AGENT_URL=https://notification-agent.aws.region.elb.amazonaws.com
      - FLIGHT_AGENT_URL=https://flight-agent.aws.region.elb.amazonaws.com
    volumes:
      - .:/app
    command: python orchestrator.py
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import orchestrator; print('Orchestrator healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # External agent services (deployed separately on AWS by other teams)
  # These are commented out for local development only
  # In production, these will be deployed as separate ECS services on AWS
  
  # hotel-agent: (Deployed on AWS by hotel team)
  # hospital-agent: (Deployed on AWS by hospital team)  
  # voice-agent: (Deployed on AWS by voice team)
  # notification-agent: (Deployed on AWS by notification team)
  # flight-agent: (Deployed on AWS by flight team)