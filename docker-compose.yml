version: '3.8'

services:
  guardian-orchestrator:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: guardian-orchestrator
    ports:
      - "8000:8000"
    environment:
      # Application Settings
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - SECRET_KEY=${SECRET_KEY:-your-production-secret-key}
      
      # External agent endpoints (AWS URLs for production)
      - HOTEL_AGENT_URL=${HOTEL_AGENT_URL:-https://hotel-agent.aws.region.elb.amazonaws.com}
      - HOSPITAL_AGENT_URL=${HOSPITAL_AGENT_URL:-https://hospital-agent.aws.region.elb.amazonaws.com}
      - VOICE_AGENT_URL=${VOICE_AGENT_URL:-http://18.217.151.15:8000/jsonrpc}
      - NOTIFICATION_AGENT_URL=${NOTIFICATION_AGENT_URL:-https://notification-system-h36d.onrender.com}
      - FLIGHT_AGENT_URL=${FLIGHT_AGENT_URL:-http://54.158.27.0:8001/a2a}
      
      # LLM Integration (Optional)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      
      # Security Settings
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-jwt-secret-key}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-your-encryption-key-32-chars-long}
      
      # HIPAA Compliance
      - HIPAA_MODE=true
      - AUDIT_LOG_ENABLED=true
      - DATA_RETENTION_DAYS=2555
      
      # HIPAA Database Configuration
      - DATABASE_URL=${DATABASE_URL:-postgresql://guardian_user:guardian_secure_2024@localhost:5432/guardian_hipaa_db}
      - HIPAA_ENCRYPTION_PASSWORD=${HIPAA_ENCRYPTION_PASSWORD:-guardian_hipaa_encryption_password_2024_secure}
      - HIPAA_ENCRYPTION_SALT=${HIPAA_ENCRYPTION_SALT:-guardian_hipaa_salt_2024_secure}
      
      # Monitoring
      - PROMETHEUS_ENABLED=true
      - HEALTH_CHECK_INTERVAL_HOURS=1
      
    volumes:
      - guardian_logs:/app/logs
      - guardian_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    networks:
      - guardian-network

  # Optional: Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: guardian-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-guardian_redis_pass}
    networks:
      - guardian-network
    profiles:
      - with-redis

  # Optional: PostgreSQL for persistent data (if needed)
  postgres:
    image: postgres:15-alpine
    container_name: guardian-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-guardian_db}
      - POSTGRES_USER=${POSTGRES_USER:-guardian}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-guardian_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - guardian-network
    profiles:
      - with-postgres

  # Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: guardian-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - guardian-orchestrator
    restart: unless-stopped
    networks:
      - guardian-network
    profiles:
      - with-nginx

volumes:
  guardian_logs:
    driver: local
  guardian_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  guardian-network:
    driver: bridge