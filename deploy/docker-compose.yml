version: '3.8'

services:
  guardian-orchestrator:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: guardian-orchestrator
    ports:
      - "8000:8000"
    environment:
      # Application Settings
      - ENVIRONMENT=production
      - DEBUG=false
      - LOG_LEVEL=INFO
      - SECRET_KEY=${SECRET_KEY:?Set SECRET_KEY}
      
      # External agent endpoints; configure only the services you intend to call
      - HOTEL_AGENT_URL=${HOTEL_AGENT_URL:-}
      - HOSPITAL_AGENT_URL=${HOSPITAL_AGENT_URL:-}
      - VOICE_AGENT_URL=${VOICE_AGENT_URL:-}
      - NOTIFICATION_AGENT_URL=${NOTIFICATION_AGENT_URL:-}
      - FLIGHT_AGENT_URL=${FLIGHT_AGENT_URL:-}
      
      # LLM Integration (Optional)
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      
      # Security Settings
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?Set JWT_SECRET_KEY}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      
      # Prototype audit and retention feature flags
      - HIPAA_MODE=true
      - AUDIT_LOG_ENABLED=true
      - DATA_RETENTION_DAYS=2555
      
      # Database and encryption configuration
      - DATABASE_URL=${DATABASE_URL:?Set DATABASE_URL}
      - HIPAA_ENCRYPTION_PASSWORD=${HIPAA_ENCRYPTION_PASSWORD:?Set HIPAA_ENCRYPTION_PASSWORD}
      - HIPAA_ENCRYPTION_SALT=${HIPAA_ENCRYPTION_SALT:-guardian_hipaa_salt_2024}
      
      # Monitoring
      - PROMETHEUS_ENABLED=true
      - HEALTH_CHECK_INTERVAL_HOURS=1
      
    volumes:
      - guardian_logs:/app/logs
      - guardian_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'
    networks:
      - guardian-network

  # Optional: Redis for caching and session management
  redis:
    image: redis:7-alpine
    container_name: guardian-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    networks:
      - guardian-network
    profiles:
      - with-redis

  # Optional: PostgreSQL for persistent data (if needed)
  postgres:
    image: postgres:15-alpine
    container_name: guardian-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-guardian_db}
      - POSTGRES_USER=${POSTGRES_USER:-guardian}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - guardian-network
    profiles:
      - with-postgres

  # Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: guardian-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - guardian-orchestrator
    restart: unless-stopped
    networks:
      - guardian-network
    profiles:
      - with-nginx

volumes:
  guardian_logs:
    driver: local
  guardian_data:
    driver: local
  redis_data:
    driver: local
  postgres_data:
    driver: local

networks:
  guardian-network:
    driver: bridge
